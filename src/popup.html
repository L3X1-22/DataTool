<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>DataTool</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- 🔴 HEADER -->
  <header class="header">
    <div class="left">
      <img src="logo.png" alt="Logo" class="logo">
    </div>
    <h1>DataTool</h1>
    <div class="right">
      <!-- Toggle Dark Mode -->
      <label class="switch" title="Modo oscuro">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- 📅 BODY -->
  <main class="container">

    <!-- Switch: Modo local (decide si las celdas 1 y 2 hacen fetch o piden archivo) -->
    <div class="section-group section-inline" id="localModeSection">
      <label for="localModeToggle">Modo local</label>
      <label class="switch" title="Modo local">
        <input type="checkbox" id="localModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Sección de Fecha (Peticiones automáticas) -->
    <div class="section-group" id="dateSection">
      <label for="date">Fecha de consulta (Fuentes automáticas):</label>
      <input type="date" id="date">
    </div>

    <hr class="divider" />

    <!-- 🔲 CUADRÍCULA 2x2 -->
    <!-- data-mode="fetch"  -> celdas 1 y 2 muestran "Listo para hacer fetch" -->
    <!-- data-mode="local"  -> celdas 1 y 2 muestran input de archivo        -->
    <section class="grid-2x2" id="sourcesGrid" data-mode="fetch">

      <!-- Celda 1: Fuente 1 (fetch o manual, según modo) -->
      <div class="grid-cell" id="cell1" data-slot="1">
        <div class="cell-content cell-fetch">
          <span class="cell-icon">⚡</span>
          <p>Listo para hacer fetch</p>
        </div>
        <div class="cell-content cell-upload">
          <label for="fileSource1">Fuente 1 (CSV Manual)</label>
          <input type="file" id="fileSource1" accept=".csv" class="file-input">
        </div>
      </div>

      <!-- Celda 2: Fuente 2 (fetch o manual, según modo) -->
      <div class="grid-cell" id="cell2" data-slot="2">
        <div class="cell-content cell-fetch">
          <span class="cell-icon">⚡</span>
          <p>Listo para hacer fetch</p>
        </div>
        <div class="cell-content cell-upload">
          <label for="fileSource2">Fuente 2 (CSV Manual)</label>
          <input type="file" id="fileSource2" accept=".csv" class="file-input">
        </div>
      </div>

      <!-- Celda 3: Fuente 3 (siempre manual) -->
      <div class="grid-cell grid-cell-static" id="cell3" data-slot="3">
        <div class="cell-content cell-upload">
          <label for="fileSource3">Fuente 3 (CSV Manual)</label>
          <input type="file" id="fileSource3" accept=".csv" class="file-input">
        </div>
      </div>

      <!-- Celda 4: Fuente 4 (siempre manual) -->
      <div class="grid-cell grid-cell-static" id="cell4" data-slot="4">
        <div class="cell-content cell-upload">
          <label for="fileSource4">Fuente 4 (CSV Manual)</label>
          <input type="file" id="fileSource4" accept=".csv" class="file-input">
        </div>
      </div>

    </section>

    <button id="startBtn">Iniciar Procesamiento</button>
  </main>

  <!-- Scripts -->
  <script src="lib/papaparse.js"></script>
  <script type="module" src="popup.js"></script>
</body>

</html>
