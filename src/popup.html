<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>DataTool</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- 🔴 HEADER -->
  <header class="header">
    <div class="left">
      <img src="logo.png" alt="Logo" class="logo">
    </div>
    <h1>DataTool</h1>
    <div class="right">
      <!-- Toggle Dark Mode -->
      <label class="switch" title="Modo oscuro">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- 📅 BODY -->
  <main class="container">

    <!-- Switch: Modo local -->
    <div class="section-group section-inline" id="localModeSection">
      <label for="localModeToggle">Modo local</label>
      <label class="switch" title="Modo local">
        <input type="checkbox" id="localModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Sección de Fecha (Solo visible en modo Fetch / Automático) -->
    <div class="section-group" id="dateSection">
      <label for="date">Fecha de consulta (Integrify):</label>
      <input type="date" id="date">
    </div>

    <hr class="divider" />

    <!-- 🔲 CUADRÍCULA 2x2 -->
    <section class="grid-2x2" id="sourcesGrid" data-mode="fetch">

      <!-- Celda 1: Integrify (Fetch o Manual según modo) -->
      <div class="grid-cell" id="cell1" data-slot="1">
        <div class="cell-content cell-fetch">
          <span class="cell-icon">⚡</span>
          <p>Listo para hacer fetch a Integrify</p>
        </div>
        <div class="cell-content cell-upload">
          <label for="fileSource1">Integrify (CSV Manual)</label>
          <input type="file" id="fileSource1" accept=".csv" class="file-input">
        </div>
      </div>

      <!-- Celda 2: Elasticnet (Siempre ZIP Manual) -->
      <div class="grid-cell grid-cell-static" id="cell2" data-slot="2">
        <div class="cell-content cell-upload">
          <label for="fileSource2">Elasticnet (ZIP Manual)</label>
          <input type="file" id="fileSource2" accept=".zip,.csv" class="file-input">
        </div>
      </div>

      <!-- Celda 3: friendlyIoT (Siempre CSV Manual) -->
      <div class="grid-cell grid-cell-static" id="cell3" data-slot="3">
        <div class="cell-content cell-upload">
          <label for="fileSource3">friendlyIoT (CSV Manual)</label>
          <input type="file" id="fileSource3" accept=".csv" class="file-input">
        </div>
      </div>

      <!-- Celda 4: ImasterNCE (Siempre CSV Manual) -->
      <div class="grid-cell grid-cell-static" id="cell4" data-slot="4">
        <div class="cell-content cell-upload">
          <label for="fileSource4">ImasterNCE (CSV Manual)</label>
          <input type="file" id="fileSource4" accept=".csv" class="file-input">
        </div>
      </div>

    </section>

    <button id="startBtn">Iniciar Procesamiento</button>
  </main>

  <!-- Scripts -->
  <script src="lib/jszip.min.js"></script>
  <script src="lib/papaparse.js"></script>
  <script type="module" src="popup.js"></script>
</body>

</html>
